name: clean-source-and-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned media and web-link dependencies
        run: |
          python -m venv work/venv
          work/venv/bin/python -m pip install --disable-pip-version-check \
            --require-hashes -r requirements-macos.txt
          work/venv/bin/python -m yt_dlp --version
          work/venv/bin/deno --version
          echo "FFMPEG=$(work/venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Run clean-source and offline regression gate
        run: python scripts/release_check.py

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned media and web-link dependencies
        shell: pwsh
        run: |
          python -m venv work/venv
          work/venv/Scripts/python.exe -m pip install --disable-pip-version-check `
            --require-hashes -r requirements-windows.txt
          work/venv/Scripts/python.exe -m yt_dlp --version
          work/venv/Scripts/deno.exe --version
          $ffmpeg = work/venv/Scripts/python.exe -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          "FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run clean-source and offline regression gate
        run: python scripts/release_check.py
