name: clean-source-and-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned media and web-link dependencies
        run: |
          python -m venv work/venv
          work/venv/bin/python -m pip install --disable-pip-version-check \
            --require-hashes -r requirements-macos.txt
          work/venv/bin/python -m yt_dlp --version
          work/venv/bin/deno --version
          echo "FFMPEG=$(work/venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Run clean-source and offline regression gate
        run: python scripts/release_check.py

  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check zero-prerequisite Windows bootstrap entry
        shell: pwsh
        run: |
          $local = powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\install-windows.ps1 -CheckOnly | ConvertFrom-Json
          if ($local.status -ne "checked" -or $local.platform -ne "Windows") {
            throw "Local Windows installer check failed"
          }
          $standalone = Join-Path $env:RUNNER_TEMP "install-windows.ps1"
          Copy-Item .\install-windows.ps1 $standalone
          $remote = powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File $standalone -CheckOnly | ConvertFrom-Json
          if ($remote.source_strategy -ne "embedded_verified_bundle" -or
              $remote.git_required -or $remote.github_source_required -or
              -not $remote.embedded_source_ready -or $remote.embedded_source_version -ne "0.4.0") {
            throw "Self-contained Windows installer check failed"
          }
      - name: Run standalone installer and regression gate
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP "self-contained-install"
          $env:LOCALAPPDATA = Join-Path $isolated "local"
          $env:USERPROFILE = Join-Path $isolated "profile"
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA, $env:USERPROFILE -Force | Out-Null
          $standalone = Join-Path $env:RUNNER_TEMP "install-windows.ps1"
          $installOutput = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $standalone 2>&1
          $installOutput | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone Windows install failed with exit code $LASTEXITCODE"
          }
          $runtime = Join-Path $env:LOCALAPPDATA "WeixinReplayToMP3\runtime"
          $runtimePython = Join-Path $runtime "work\venv\Scripts\python.exe"
          $runtimeCli = Join-Path $runtime "weixin_replay_cli.py"
          $preflight = & $runtimePython $runtimeCli preflight | ConvertFrom-Json
          if (-not $preflight.ready -or -not $preflight.web_link_ready) {
            throw "Installed private runtime is not ready"
          }
          $ffmpeg = & $runtimePython -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          $env:FFMPEG = $ffmpeg
          & $runtimePython scripts/release_check.py
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release gate failed with exit code $LASTEXITCODE"
          }
